spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/veterinaria}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  # Usa X-Forwarded-For de proxies internos (Render) para obtener la IP real del cliente
  # en el control de intentos fallidos del inicio de sesión.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}

app:
  time-zone: ${APP_TIME_ZONE:America/Bogota}
  orientacion:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    secret: ${APP_JWT_SECRET:clave-secreta-solo-para-desarrollo-cambiar-en-produccion-2026}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  seguridad:
    login:
      max-intentos: ${APP_LOGIN_MAX_INTENTOS:5}
      bloqueo-minutos: ${APP_LOGIN_BLOQUEO_MINUTOS:15}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
