services:
  - type: web
    name: vetagenda-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api-docs
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL
        # Se gestiona directamente en Render para permitir migraciones de la
        # base gratuita sin que un Blueprint Sync restaure una URL vencida.
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_TIME_ZONE
        value: America/Bogota
      - key: APP_JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

databases:
  - name: vetagenda-postgres
    plan: free
    databaseName: vetagenda
    user: vetagenda
